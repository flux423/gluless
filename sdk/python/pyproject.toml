[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gluless"
version = "0.1.0"
description = "An agent-native executable contract language and runtime"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.0",
    "ag-ui-protocol>=0.1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gluless*"]
