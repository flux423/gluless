openapi: 3.0.3

info:
  title: GasCity API
  description: >
    GasCity platform API — manages cities and agent sessions.

    GluLess binding metadata is declared per-operation via x-gluless-* extensions.
    These annotations are consumed by the GluLess OpenAPI importer to project
    Utility objects into the runtime registry.

    Model:

      OpenAPI contract    (this file — authoritative API definition)
          ↓  x-gluless-* extensions
      OpenAPIImporter     (sdk/python/gluless/importers/openapi.py)
          ↓  Utility objects
      UtilityRegistry     (runtime index, per-process)
          ↓  ContextResolver
      GluLess runtime

    This file does NOT act as an independent Utility Registry.
  version: 0.2.0

x-provider-name: GasCity

servers:
  - url: http://localhost:8000/v0
    description: Local development server (mock)

security:
  - ApiKeyAuth: []

paths:

  /cities:
    get:
      operationId: listCities
      summary: List all cities
      description: Returns all cities registered in the GasCity network.
      # GluLess binding metadata — consumed by OpenAPIImporter
      x-gluless-name: GasCity.cities.list
      x-gluless-type: read
      x-gluless-side-effects: none
      tags:
        - cities
      responses:
        '200':
          description: Array of City objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /cities/{name}:
    post:
      operationId: createCity
      summary: Create a city
      description: >
        Register a new city in the GasCity network.
        This is a state-mutating operation; it is denied by default under
        the demo contract's "deny *" limit and requires explicit allow.
      # GluLess binding metadata — consumed by OpenAPIImporter
      x-gluless-name: GasCity.city.create
      x-gluless-type: mutation
      x-gluless-side-effects: create
      tags:
        - cities
      parameters:
        - name: name
          in: path
          description: City slug (unique identifier).
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityCreate'
      responses:
        '201':
          description: City created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: City name already exists
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/{id}/nudge:
    post:
      operationId: nudgeSession
      summary: Nudge a session
      description: >
        Request a session nudge or restart. Produces an external message.
        Denied by default under "deny *"; requires explicit allow limit.
      # GluLess binding metadata — consumed by OpenAPIImporter
      x-gluless-name: GasCity.sessions.nudge
      x-gluless-type: mutation
      x-gluless-side-effects: external_message
      tags:
        - sessions
      parameters:
        - name: id
          in: path
          description: Session UUID.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudgeRequest'
      responses:
        '200':
          description: Nudge accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NudgeResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Session not found
        '409':
          description: Session has active tasks and force was not set
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns operational status. Not a GluLess utility — excluded from registry.
      x-gluless-exclude: true
      tags:
        - meta
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-GasCity-Token
      description: >
        Service token issued by GasCity. Injected by GluLess runtime
        from environment variable GASCITY_TOKEN.

  responses:
    UnauthorizedError:
      description: API key missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    City:
      type: object
      required:
        - name
        - health
      properties:
        name:
          type: string
          example: blucity
        health:
          type: string
          enum: [healthy, degraded, down]
          example: healthy
        version:
          type: string
          example: v0.1.4
        agents:
          type: integer
          example: 3

    CityCreate:
      type: object
      required:
        - health
      properties:
        health:
          type: string
          enum: [healthy, degraded, down]
          default: healthy

    NudgeRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false

    NudgeResult:
      type: object
      required:
        - status
        - sessionId
      properties:
        status:
          type: string
          enum: [nudged, already-idle, forced]
          example: nudged
        sessionId:
          type: string
          format: uuid
        message:
          type: string

    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        version:
          type: string
          example: 0.2.0
        uptime:
          type: integer
          description: Server uptime in seconds.

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
