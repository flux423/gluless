<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GluLess — Agent Console</title>
  <meta name="description" content="GluLess GLU Agent console. Goal · Limits · Utilities. AG-UI streaming protocol." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="shell">

  <!-- ── Top bar ── -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="wordmark">
        <span class="wordmark-glu">GLU</span>
        <span class="wordmark-less">less</span>
      </div>
      <div class="topbar-sep"></div>
      <span class="topbar-label">Agent Console</span>
    </div>

    <div class="phase-strip" id="phase-strip">
      <div class="phase-pip" data-phase="compiling">
        <span class="pip-dot"></span><span>Compile</span>
      </div>
      <div class="phase-connector"></div>
      <div class="phase-pip" data-phase="planning">
        <span class="pip-dot"></span><span>Plan</span>
      </div>
      <div class="phase-connector"></div>
      <div class="phase-pip" data-phase="executing">
        <span class="pip-dot"></span><span>Execute</span>
      </div>
      <div class="phase-connector"></div>
      <div class="phase-pip" data-phase="complete">
        <span class="pip-dot"></span><span>Done</span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="agent-pill" id="agent-pill">
        <span class="pill-dot offline"></span>
        <span id="agent-pill-label">Offline</span>
      </div>
    </div>
  </header>

  <!-- ── Body ── -->
  <div class="body">

    <!-- Left: contract inspector -->
    <aside class="inspector">
      <div class="inspector-section">
        <div class="inspector-heading">Contract</div>
        <div class="inspector-card" id="card-id">
          <div class="card-label">ID</div>
          <div class="card-value mono" id="val-id">—</div>
        </div>
        <div class="inspector-card goal" id="card-goal">
          <div class="card-label">
            <span class="card-icon">◎</span> Goal
          </div>
          <div class="card-value mono" id="val-goal">cities.listed == true</div>
        </div>
      </div>

      <div class="inspector-section">
        <div class="inspector-heading">Limits</div>
        <div id="limits-list" class="limits-list">
          <div class="limit-row deny"><span class="limit-verb">deny</span> *</div>
          <div class="limit-row allow"><span class="limit-verb">allow</span> GasCity.cities.list</div>
        </div>
      </div>

      <div class="inspector-section">
        <div class="inspector-heading">Utilities</div>
        <div id="utilities-list" class="utilities-list">
          <div class="utility-row" id="u-GasCity.cities.list">
            <span class="u-status-dot"></span>
            <span class="u-id">GasCity.cities.list</span>
          </div>
        </div>
      </div>

      <div class="inspector-section" id="evidence-section" style="display:none">
        <div class="inspector-heading">Evidence</div>
        <div id="evidence-list" class="evidence-list"></div>
      </div>

      <div class="inspector-metrics" id="metrics-block" style="display:none">
        <div class="metric-row">
          <span class="metric-k">Plan</span>
          <span class="metric-v" id="m-plan">0</span>
        </div>
        <div class="metric-row">
          <span class="metric-k">Observations</span>
          <span class="metric-v" id="m-obs">0</span>
        </div>
        <div class="metric-row">
          <span class="metric-k">Evidence</span>
          <span class="metric-v" id="m-ev">0</span>
        </div>
        <div class="metric-row">
          <span class="metric-k">Events</span>
          <span class="metric-v" id="m-events">0</span>
        </div>
      </div>
    </aside>

    <!-- Right: terminal + composer -->
    <div class="workspace">

      <!-- Stream terminal -->
      <div class="terminal" id="terminal">
        <div class="terminal-gutter" id="terminal-gutter"></div>
        <div class="terminal-body" id="terminal-body">
          <div class="term-empty" id="term-empty">
            <div class="term-empty-sigil">⬡</div>
            <div class="term-empty-head">Ready to execute</div>
            <div class="term-empty-sub">Load a contract below and press <kbd>⌘↵</kbd> to run</div>
          </div>
        </div>
      </div>

      <!-- Composer -->
      <div class="composer">
        <div class="composer-editor">
          <div class="composer-tabs">
            <button class="ctab active" data-mode="contract" id="ctab-contract">YAML</button>
            <button class="ctab" data-mode="natural" id="ctab-natural">Natural</button>
            <span class="composer-endpoint" id="composer-endpoint">↗ localhost:8080</span>
          </div>
          <textarea
            id="contract-input"
            class="composer-textarea"
            rows="5"
            placeholder="Paste a GLU contract YAML…"
            spellcheck="false"
          ></textarea>
        </div>
        <div class="composer-actions">
          <div class="action-left">
            <button class="action-btn ghost" id="btn-load-demo">Load demo</button>
            <button class="action-btn ghost" id="btn-clear">Clear log</button>
          </div>
          <div class="action-right">
            <button class="action-btn primary" id="btn-run" disabled>
              <span id="run-icon">▶</span>
              <span id="run-label">Run</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
